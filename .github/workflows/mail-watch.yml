# Revisa cada 10 minutos la bandeja de quienes tienen conversaciones marcadas
# como importantes, para que la respuesta avise al teléfono aunque nadie tenga
# el hub abierto. Vive aquí porque el plan Hobby de Vercel solo permite crons
# diarios.
#
# Secretos del repo (Settings → Secrets and variables → Actions):
#   CRON_SECRET  el mismo valor que la variable CRON_SECRET en Vercel
name: Revisar correos importantes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: mail-watch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Llamar al cron de hilos marcados
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Falta el secreto CRON_SECRET; no se revisa el correo."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 320 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://pimepanama.com/api/empresa/cron/mail-watch
